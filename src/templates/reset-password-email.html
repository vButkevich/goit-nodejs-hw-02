<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password email</title>
</head>

<body>
  <h1 style="color: blue;">Hello, {{name}}!</h1>
  <p>{{email}}</p>
  <p>Click <a href="{{link}}?token={{token}}" target="_blank">here</a> to reset your password!</p>
  <pre>
  uri: {{link}}
  method: POST
  body:
  {
    "token": "{{token}}",
    "password": "***"
  }
</pre>
<hr>
  <sup>
    <p id="date-time-stamp"></p>
  </sup>


  <script>
    const dateTimeStamp = new Date();
    const element = document.querySelector('#date-time-stamp')
    element.innerHTML = dateTimeStamp.toLocaleString();
  </script>
</body>

</html>

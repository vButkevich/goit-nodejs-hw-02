#/swagger/paths/students/post.yaml

tags:
  - Contacts
summary: Create contact
operationId: createStudent
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - email
          - photo
        properties:
          name:
            description: "Contacts's name"
            type: string
            example: 'John Doe'
          userId:
            description: "Contact's parent id"
            type: string
            example: 65e4decdd286b30065d54af9
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: Creates a student
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a student!
            data:
              type: object
              # $ref: '../../components/schemas/student.yaml'
              $ref: ..\..\components\schemas\student.yaml
  '401':
    $ref: '../../components/responses/401.yaml'
